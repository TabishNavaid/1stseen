name: Changed-evidence forecast regeneration

on:
  schedule:
    # 20:52 UTC, once a day, after both of the day's current-jobs runs and signal detection have
    # had their full timeout to finish. It ran four times a day until 2026-09-23; two of those four
    # did nothing, because regeneration works from a cursor and the run before it had already
    # consumed the changes (0 roles in 7 to 13 seconds). A forecast predicts a window months out
    # from evidence that moves slowly, so a role whose evidence changed is re-forecast within a day
    # rather than within six hours, and the changed-evidence trigger path is unchanged.
    - cron: "52 20 * * *"
  workflow_dispatch:

# Shared with every collection writer and not keyed by ref: one production database.
# `forecasts` has no uniqueness on (role, input fingerprint), so two overlapping
# regenerations would each insert the same new version. See current-jobs.yml.
concurrency:
  group: firstseen-collection
  cancel-in-progress: false

permissions:
  contents: read
  # Read-only, for the collection-health step's "last successful run" per workflow.
  actions: read
  # collection-health --alert and the ops-alert step open, update, and close alert issues.
  issues: write

env:
  # Regeneration makes no source requests; these are set so every collection
  # workflow runs with the same bounds if that ever changes.
  MAX_SOURCE_BYTES: ${{ vars.MAX_SOURCE_BYTES || '10000000' }}
  HTTP_MIN_HOST_INTERVAL_SECONDS: ${{ vars.HTTP_MIN_HOST_INTERVAL_SECONDS || '0.25' }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # A full pass over the 3,451-role local corpus measured about 12 s once the
    # evidence set is preloaded; the limit covers the readiness step and a slow runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e worker
      - name: Regenerate only changed roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m firstseen.cli regenerate-forecasts > forecast-regeneration-summary.json
      # A role followed after its last regeneration would otherwise never receive
      # milestones, because plans are written when a new forecast version lands.
      # The planner is deterministic and the store upserts, so this is a no-op
      # for roles that already have a current plan.
      - name: Persist work-back plans for followed roles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m firstseen.cli plan-readiness > readiness-planning-summary.json
      - name: Publish regeneration summary
        if: ${{ always() }}
        run: |
          for summary in forecast-regeneration-summary.json readiness-planning-summary.json; do
            if [ -f "$summary" ]; then
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      # Runs last and on failure too, so a collector that has silently stopped
      # writing shows up here even when regeneration itself had nothing to do.
      # Dependency-free script: no npm install.
      - uses: actions/setup-node@v4
        if: ${{ always() }}
        with:
          node-version: "22.14.0"
      # The report runs after the forecasts are already committed, so its own failure is not regeneration's. It was:
      # when its 24-hour row count timed out, this workflow was marked failed and the owner was told the site's dates
      # had stopped being rebuilt. It now carries its own alert, under its own key, and closes on its own.
      - name: Report collection health
        id: collection_health
        if: ${{ always() }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collection-health.mjs --alert
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: forecast-regeneration-${{ github.run_id }}
          path: |
            forecast-regeneration-summary.json
            readiness-planning-summary.json
          if-no-files-found: ignore
          retention-days: 14
      # Last, and on failure, timeout, or cancellation too: opens or updates this workflow's ops-alert issue, assigned
      # to the owner, and the next success closes it (docs/operations.md). A step, not a job: no extra billed minutes.
      - uses: ./.github/actions/ops-alert
        if: ${{ always() }}
        with:
          status: ${{ steps.collection_health.outcome }}
          component: Collection health report
      - uses: ./.github/actions/ops-alert
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
