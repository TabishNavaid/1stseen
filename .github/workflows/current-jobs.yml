name: Current job collection

on:
  schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC. Collection workflows are staggered at least an
    # hour apart; see the note on `concurrency` below.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      company:
        description: "Optional company name, domain, or UUID"
        required: false
        type: string

# Every workflow that writes collection state shares this group so writers are
# serialized. It is not keyed by ref: there is one production database, so a run
# dispatched from a branch must queue behind a scheduled run on main, not write
# beside it. GitHub keeps only one pending run per group and cancels an older
# pending run when a newer one queues, which is why the schedules are staggered by
# more than the longest timeout. See docs/github-actions-collection.md.
concurrency:
  group: firstseen-collection
  cancel-in-progress: false

permissions:
  contents: read
  # The ops-alert step opens, updates, and closes this workflow's alert issue.
  issues: write

env:
  # config.py defaults to a 2 MB response cap, which rejects real ATS boards. The
  # literal fallback means an unset repository variable cannot restore that cap.
  MAX_SOURCE_BYTES: ${{ vars.MAX_SOURCE_BYTES || '10000000' }}
  HTTP_MIN_HOST_INTERVAL_SECONDS: ${{ vars.HTTP_MIN_HOST_INTERVAL_SECONDS || '0.25' }}
  # robots.txt enforcement (worker/src/firstseen/robots.py). Off until the owner turns it on; see docs/takedown.md.
  ROBOTS_TXT_ENFORCED: ${{ vars.ROBOTS_TXT_ENFORCED || 'false' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    # Measured on the local validation corpus: 37 current sources plus enrichment of
    # 13 companies took 487 s. The 97 configured current sources project to about
    # 17 minutes, so 45 leaves room for company growth.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e worker
      - name: Collect all current recruiting sources
        if: ${{ github.event_name == 'schedule' || inputs.company == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_DEFAULT_ROUTES: ${{ vars.LLM_DEFAULT_ROUTES }}
          LLM_EXTRACT_ROUTES: ${{ vars.LLM_EXTRACT_ROUTES }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'http://localhost:11434' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m firstseen.cli ingest --all --collection current > current-jobs-summary.json
      - name: Collect one company for development
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.company != '' }}
        env:
          TARGET_COMPANY: ${{ inputs.company }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_DEFAULT_ROUTES: ${{ vars.LLM_DEFAULT_ROUTES }}
          LLM_EXTRACT_ROUTES: ${{ vars.LLM_EXTRACT_ROUTES }}
          LLM_API_BASE: ${{ vars.LLM_API_BASE || 'http://localhost:11434' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m firstseen.cli ingest --company "$TARGET_COMPANY" --collection current > current-jobs-summary.json
      - name: Publish collection summary
        if: ${{ always() }}
        run: |
          if [ -f current-jobs-summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat current-jobs-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: current-jobs-${{ github.run_id }}
          path: current-jobs-summary.json
          if-no-files-found: ignore
          retention-days: 14
      # Last, and on failure, timeout, or cancellation too: opens or updates this workflow's ops-alert issue, assigned
      # to the owner, and the next success closes it (docs/operations.md). A step, not a job: no extra billed minutes.
      - uses: ./.github/actions/ops-alert
        if: ${{ always() }}
        with:
          status: ${{ job.status }}
