name: Report to the ops alert issue
description: >
  Opens or updates the ops-alert issue for this workflow when the job did not succeed, and closes it when it did
  (scripts/ops-alert.mjs, docs/operations.md). Use as the last step of a job, with `if: always()`, and give the job
  `issues: write`. Needs the repository checked out; uses the runner's preinstalled Node.
inputs:
  status:
    description: The job's status. Pass job.status from the calling workflow.
    required: true
  component:
    description: >
      Name of one step whose failure is not the workflow's, such as a reporting step that runs after the work is
      already committed. Reports under its own alert key and title, leaving the workflow's own alert alone.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        JOB_STATUS: ${{ inputs.status }}
        ALERT_COMPONENT: ${{ inputs.component }}
      run: |
        if [ -n "$ALERT_COMPONENT" ]; then
          node scripts/ops-alert.mjs --status "$JOB_STATUS" --component "$ALERT_COMPONENT"
        else
          node scripts/ops-alert.mjs --status "$JOB_STATUS"
        fi
