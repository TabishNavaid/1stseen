[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firstseen-intelligence"
version = "0.15.0"
description = "Evidence ingestion and statistical forecasting for recurring recruiting programs"
requires-python = ">=3.11"
dependencies = [
  "litellm>=1.50,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "supabase>=2.7,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
api = ["uvicorn>=0.32,<1"]
dev = ["ruff>=0.7,<1", "mypy>=1.13,<2"]

[project.scripts]
firstseen = "firstseen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
